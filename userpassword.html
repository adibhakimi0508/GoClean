<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <table class="layout" width="100%" cellpadding="15" cellspacing="0">
    <tr>

      <!-- SIDEBAR -->
      <td class="sidebar" valign="top">
        <img src="logo.png" alt="[Logo]" width="100">
        <ul>
          <li><a href="userdashboard.html#home">Home</a></li>
          <li><a href="userdashboard.html#complaint">Complaint</a></li>
          <li><a href="userdashboard.html#report">Report</a></li>
          <li><a href="userdashboard.html#news">News</a></li>
          <li><a href="usersettings.html" class="active">Menu</a></li>
        </ul>
      </td>

      <!-- MAIN CONTENT -->
      <td class="content" valign="top">
        <div>
          <p><a href="usersettings.html">&larr; Back to Menu</a></p>
          <h1>Change Password</h1>
          <p class="desc">Change your password by entering your current password and then a new one twice. Choose a password that is hard to guess.</p>

          <article>
            <form onsubmit="changePassword(); return false;">
              <p>
                <label for="current">Current Password</label><br>
                <input type="password" id="current" required>
              </p>
              <p>
                <label for="newpass">New Password</label><br>
                <input type="password" id="newpass" required>
              </p>
              <p>
                <label for="confirmpass">Confirm New Password</label><br>
                <input type="password" id="confirmpass" required>
              </p>
              <button type="submit">Change Password</button>
            </form>
          </article>
        </div>
      </td>
    </tr>
  </table>

  <script>
    // Demo only: no real password change happens
    function changePassword() {
      if (document.getElementById("newpass").value !== document.getElementById("confirmpass").value) {
        alert("The new passwords do not match.");
        return;
      }
      alert("Password changed successfully.");
      document.getElementById("current").value = "";
      document.getElementById("newpass").value = "";
      document.getElementById("confirmpass").value = "";
    }
  </script>
</body>
</html>
